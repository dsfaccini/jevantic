  <text x="218" y="484" class="label" fill="#c9b5ff">Manual mapping</text>
  <line x1="188" y1="526" x2="1728" y2="526" stroke="#42444d" stroke-width="2"/>
  <text x="192" y="580.0" class="line-number">01</text><text x="260" y="580.0" class="code" style="font-size:24.07px" xml:space="preserve">by_key: dict[str, Candidate] = {str(index): candidate <tspan fill="#f1c982">for</tspan> index, candidate <tspan fill="#f1c982">in</tspan> enumerate(candidates)}</text><text x="192" y="623.3333333333334" class="line-number">02</text><text x="260" y="623.3333333333334" class="code" style="font-size:24.07px" xml:space="preserve">criteria: dict[str, JsonContent | None] = {</text><text x="192" y="666.6666666666666" class="line-number">03</text><text x="260" y="666.6666666666666" class="code" style="font-size:24.07px" xml:space="preserve">    key: {<tspan fill="#f1c982">&#x27;identifier&#x27;</tspan>: c.identifier, <tspan fill="#f1c982">&#x27;summary&#x27;</tspan>: c.summary} <tspan fill="#f1c982">for</tspan> key, c <tspan fill="#f1c982">in</tspan> by_key.items()</text><text x="192" y="710.0" class="line-number">04</text><text x="260" y="710.0" class="code" style="font-size:24.07px" xml:space="preserve">}</text><text x="192" y="753.3333333333334" class="line-number">05</text><text x="260" y="753.3333333333334" class="code" style="font-size:24.07px" xml:space="preserve">question = <tspan fill="#c9b5ff">Question</tspan>.choice(criteria, instructions=CANDIDATE_INSTRUCTIONS)</text><text x="192" y="796.6666666666667" class="line-number">06</text><text x="260" y="796.6666666666667" class="code" style="font-size:24.07px" xml:space="preserve">evaluation = <tspan fill="#f1c982">await</tspan> evaluator.evaluate(state, question)</text><text x="192" y="840.0" class="line-number">07</text><text x="260" y="840.0" class="code" style="font-size:24.07px" xml:space="preserve"><tspan fill="#f1c982">return</tspan> by_key[evaluation.value.selected]</text>
  <text x="188" y="885" class="support" fill="#a8dba8" opacity="0"> </text>
</g>
<g opacity="0.00000">
  <rect x="132" y="398" width="1656" height="510" rx="30" fill="#202127"/>
