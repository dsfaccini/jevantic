  <text x="192" y="580.0" class="line-number">01</text><text x="260" y="580.0" class="code" style="font-size:24.07px" xml:space="preserve">evaluation = <tspan fill="#f1c982">await</tspan> evaluator.select(state, candidates, instructions=CANDIDATE_INSTRUCTIONS)</text><text x="192" y="623.3333333333334" class="line-number">02</text><text x="260" y="623.3333333333334" class="code" style="font-size:24.07px" xml:space="preserve"><tspan fill="#f1c982">return</tspan> evaluation.value.selected</text>
