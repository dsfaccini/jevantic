[project]
name = "jevantic"
version = "0.1.0a0"
description = "Typed probabilistic decisions with Jev"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4,<5",
    "httpx2>=2.10,<3",
    "pydantic>=2.10,<3",
    "typesafe-sdk>=0.6.0,<0.7",
]
readme = "README.md"

[project.optional-dependencies]
pydantic-ai = [
    "pydantic-ai-slim>=2.38.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "build>=1.6.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.8",
    "trio>=0.30,<1",
]
